name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.os }} native and browser regressions
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/history-core/Cargo.toml
      - run: npx playwright install chromium
      - name: React and native command-boundary regressions
        run: npm run test:browser
        env:
          CLIPJAR_ARTIFACT_DIR: test-results/screenshots
      - name: Build the actual desktop binary with production assets
        run: npm run tauri -- build --debug --no-bundle
      - name: Real native clipboard, hidden capture, window, hotkey and privacy smoke
        run: node scripts/test-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-${{ matrix.os }}
          path: |
            test-results/
          if-no-files-found: ignore
